[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "renpy-arabic-translator"
version = "0.7.0b1"
description = "Ren'Py Arabic Translator — safe discovery and translation templates"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.8,<7",
  "pydantic>=2.10,<3",
  "SQLAlchemy>=2.0,<2.1",
  "httpx>=0.28,<1",
  "PyYAML>=6.0,<7",
  "platformdirs>=4.3,<5",
  "keyring>=25,<26",
  "fonttools>=4.55,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "ruff>=0.9,<1", "build>=1.2,<2"]
windows-build = ["pyinstaller>=6.22,<7"]
llm = ["google-genai>=1,<2", "openai>=2,<3", "deep-translator>=1.11,<2"]
cloud = ["google-cloud-translate>=3,<4", "deepl>=1,<2"]
offline = ["argostranslate>=1.9,<2"]

[project.scripts]
rat = "rat.cli.commands:main"

[project.gui-scripts]
rat-gui = "rat.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rat = ["resources/fonts/amiri/*.ttf", "resources/fonts/amiri/*.txt",
       "resources/arabic_demo/*.txt", "resources/arabic_demo/game/*.rpy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "-ra --basetemp=.pytest_tmp"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".pytest_tmp", ".local"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
